<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PFC - Program Sponsor</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- App Shell -->
  <div id="app-shell" class="shell">
    <header class="hero">
      <div class="brand-block">
        <img
          class="brand-logo"
          src="https://github.com/user-attachments/assets/0ed14a35-9025-4bc7-b757-60d0b6239a60"
          alt="PFC Prisoners For Christ"
        >
        <h1>Bible Institute Grading System</h1>
      </div>
      <div class="hero-actions">
        <div class="preferences">
          <label for="preferred-language">Language</label>
          <select id="preferred-language"></select>
        </div>
      </div>
    </header>

    <nav class="role-tabs" aria-label="Switch demo role">
      <a href="./coach.html" class="tab" data-role-link="coach">Coach</a>
      <a href="./volunteer.html" class="tab" data-role-link="volunteer">Volunteer</a>
      <a href="./sponsor.html" class="tab active" data-role-link="sponsor">Program Sponsor</a>
      <a href="./admin.html" class="tab" data-role-link="admin">Admin</a>
    </nav>

    <main class="main-content">
      <!-- Sponsor Panel -->
      <section class="role-panel active" data-role-panel="sponsor">
        <div class="panel-header">
          <h2>Manage Institutions &amp; Students</h2>
        </div>

        <div class="content-grid">
          <section class="card">
            <h3>Add Institution</h3>
            <form id="institution-form" class="form form-inline">
              <label class="grow">
                Institution name
                <input id="institution-name" type="text" placeholder="Enter institution name">
              </label>
              <button type="submit" class="secondary align-end">Add</button>
            </form>
          </section>

          <section class="card">
            <h3>Create User</h3>
            <form id="user-form" class="form">
              <label>
                Role
                <select id="user-role">
                  <option value="coach">Coach</option>
                  <option value="volunteer">Volunteer</option>
                </select>
              </label>
              <label>
                Full name
                <input id="user-name" type="text" autocomplete="name" required>
              </label>
              <label>
                Email address
                <input id="user-email" type="email" autocomplete="email" required>
              </label>
              <label>
                Password
                <input id="user-password" type="password" autocomplete="new-password" minlength="8" required>
              </label>
              <button type="submit" class="primary">Create User</button>
            </form>
          </section>

          <section class="card">
            <h3>Add Student</h3>
            <form id="student-form" class="form">
              <input id="student-edit-id" type="hidden">
              <div class="form-row">
                <label>
                  First name
                  <input id="student-first-name" type="text" autocomplete="given-name" required>
                </label>
                <label>
                  Last name
                  <input id="student-last-name" type="text" autocomplete="family-name" required>
                </label>
              </div>
              <label>
                Institution
                <select id="student-institution" required></select>
              </label>
              <div class="form-row">
                <label class="grow">
                  Student ID
                  <input id="student-identifier" type="text" required>
                </label>
                <button type="button" id="generate-student-id" class="secondary align-end">Generate ID</button>
              </div>
              <label>
                Assigned coach
                <select id="student-coach" required></select>
              </label>
              <button type="submit" class="primary">Save Student</button>
            </form>
          </section>

          <section class="card">
            <h3>Student Directory</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>ID</th>
                    <th>Institution</th>
                    <th>Coach</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="student-table"></tbody>
              </table>
            </div>
          </section>
        </div>
      </section>

      <!-- Summary & Activity (collapsed at bottom) -->
      <details class="activity-drawer">
        <summary>Activity Log &amp; Stats</summary>
        <div class="drawer-content">
          <section class="card">
            <h3>Overview</h3>
            <div class="stats" id="summary-stats"></div>
          </section>
          <section class="card">
            <h3>Email Activity</h3>
            <ul class="activity-list" id="email-log"></ul>
          </section>
        </div>
      </details>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
