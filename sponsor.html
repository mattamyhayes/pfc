<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PFC - Program Sponsor</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- App Shell -->
  <div id="app-shell" class="shell">
    <header class="hero">
      <div class="brand-block">
        <a href="./index.html">
          <img
            class="brand-logo"
            src="https://github.com/user-attachments/assets/0ed14a35-9025-4bc7-b757-60d0b6239a60"
            alt="PFC Prisoners For Christ"
          >
        </a>
        <h1>Bible Institute Grading System</h1>
      </div>
      <div class="hero-actions">
        <div class="preferences">
          <label for="preferred-language">Language</label>
          <select id="preferred-language"></select>
        </div>
      </div>
    </header>

    <nav class="role-tabs" aria-label="Switch demo role">
      <a href="./coach.html" class="tab" data-role-link="coach">Coach</a>
      <a href="./volunteer.html" class="tab" data-role-link="volunteer">Volunteer</a>
      <a href="./sponsor.html" class="tab active" data-role-link="sponsor">Program Sponsor</a>
    </nav>

    <main class="main-content">
      <!-- Sponsor Panel -->
      <section class="role-panel active" data-role-panel="sponsor">
        <div class="panel-header">
          <h2>Manage Institutions &amp; Students</h2>
        </div>

        <div class="sponsor-nav">
          <button type="button" class="sponsor-nav-btn active" data-sponsor-section="institutions">Institutions</button>
          <button type="button" class="sponsor-nav-btn" data-sponsor-section="users">Users</button>
          <button type="button" class="sponsor-nav-btn" data-sponsor-section="students">Students</button>
          <button type="button" class="sponsor-nav-btn" data-sponsor-section="directory">Student Directory</button>
          <button type="button" class="sponsor-nav-btn" data-sponsor-section="progress">Class Progress</button>
          <button type="button" class="sponsor-nav-btn" data-sponsor-section="add-class">Add a Class</button>
          <button type="button" class="sponsor-nav-btn" data-sponsor-section="add-assignment">Add Assignment</button>
          <button type="button" class="sponsor-nav-btn" data-sponsor-section="catalog">Class Catalog</button>
        </div>

        <div class="sponsor-sections">
          <section class="card sponsor-section" id="sponsor-section-institutions">
            <h3>Add Institution</h3>
            <form id="institution-form" class="form form-inline">
              <label class="grow">
                Institution name
                <input id="institution-name" type="text" placeholder="Enter institution name">
              </label>
              <button type="submit" class="secondary align-end">Add</button>
            </form>
          </section>

          <section class="card sponsor-section hidden" id="sponsor-section-users">
            <h3>Create User</h3>
            <form id="user-form" class="form">
              <label>
                Role
                <select id="user-role">
                  <option value="coach">Coach</option>
                  <option value="volunteer">Volunteer</option>
                </select>
              </label>
              <label>
                Full name
                <input id="user-name" type="text" autocomplete="name" required>
              </label>
              <label>
                Email address
                <input id="user-email" type="email" autocomplete="email" required>
              </label>
              <label>
                Password
                <input id="user-password" type="password" autocomplete="new-password" minlength="8" required>
              </label>
              <button type="submit" class="primary">Create User</button>
            </form>
          </section>

          <section class="card sponsor-section hidden" id="sponsor-section-students">
            <h3>Add Student</h3>
            <form id="student-form" class="form">
              <input id="student-edit-id" type="hidden">
              <div class="form-row">
                <label>
                  First name
                  <input id="student-first-name" type="text" autocomplete="given-name" required>
                </label>
                <label>
                  Last name
                  <input id="student-last-name" type="text" autocomplete="family-name" required>
                </label>
              </div>
              <label>
                Institution
                <select id="student-institution" required></select>
              </label>
              <div class="form-row">
                <label class="grow">
                  Student ID
                  <input id="student-identifier" type="text" required>
                </label>
                <button type="button" id="generate-student-id" class="secondary align-end">Generate ID</button>
              </div>
              <label>
                Assigned coach
                <select id="student-coach" required></select>
              </label>
              <button type="submit" class="primary">Save Student</button>
            </form>
          </section>

          <section class="card sponsor-section hidden" id="sponsor-section-directory">
            <h3>Student Directory</h3>
            <div class="directory-controls">
              <input type="text" id="student-search" placeholder="Search students..." class="directory-search">
              <select id="student-filter-institution" class="directory-filter">
                <option value="">All Institutions</option>
              </select>
              <select id="student-filter-coach" class="directory-filter">
                <option value="">All Coaches</option>
              </select>
            </div>
            <div class="table-wrap">
              <table id="student-directory-table">
                <thead>
                  <tr>
                    <th class="sortable" data-sort="name">Student</th>
                    <th class="sortable" data-sort="id">ID</th>
                    <th class="sortable" data-sort="institution">Institution</th>
                    <th class="sortable" data-sort="coach">Coach</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="student-table"></tbody>
              </table>
            </div>
          </section>

          <section class="card sponsor-section hidden" id="sponsor-section-progress">
            <h3>Class Progress</h3>
            <div class="progress-controls">
              <select id="progress-class-filter">
                <option value="">All Classes</option>
              </select>
              <select id="progress-assignment-filter">
                <option value="">All Assignments</option>
              </select>
            </div>
            <div id="class-progress-summary" class="progress-summary"></div>
            <div id="class-progress-detail" class="progress-detail"></div>
          </section>

          <section class="card sponsor-section hidden" id="sponsor-section-add-class">
            <h3>Add a Class</h3>
            <form id="add-class-form" class="form form-inline">
              <label class="grow">
                Class name
                <input id="new-class-name" type="text" placeholder="Enter class name">
              </label>
              <button type="submit" class="secondary align-end">Add Class</button>
            </form>
          </section>

          <section class="card sponsor-section hidden" id="sponsor-section-add-assignment">
            <h3>Add Assignment</h3>
            <form id="class-form" class="form">
              <label>
                Class
                <select id="class-select" required></select>
              </label>
              <label>
                Assignment name
                <input id="assignment-name" type="text" required>
              </label>
              <label>
                Number of questions
                <input id="assignment-count" type="number" min="1" value="1" required>
              </label>
              <button type="submit" class="primary">Add Assignment</button>
            </form>
          </section>

          <section class="card sponsor-section hidden" id="sponsor-section-catalog">
            <h3>Class Catalog</h3>
            <div id="class-catalog" class="card-list"></div>
          </section>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
