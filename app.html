<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PFC - Bible Institute Grading System</title>
  <script>
    // Redirect to the appropriate role page for backward compatibility
    (function() {
      var params = new URLSearchParams(window.location.search);
      var role = params.get("role");
      var pages = { coach: "coach.html", volunteer: "volunteer.html", sponsor: "sponsor.html", admin: "sponsor.html" };
      var target = pages[role] || "coach.html";
      window.location.replace("./" + target);
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
