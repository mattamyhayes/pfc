<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PFC - Coach</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- App Shell -->
  <div id="app-shell" class="shell">
    <header class="hero">
      <div class="brand-block">
        <a href="./index.html">
          <img
            class="brand-logo"
            src="https://github.com/user-attachments/assets/0ed14a35-9025-4bc7-b757-60d0b6239a60"
            alt="PFC Prisoners For Christ"
          >
        </a>
        <h1>Bible Institute Grading System</h1>
      </div>
      <div class="hero-actions">
        <div class="preferences">
          <label for="preferred-language">Language</label>
          <select id="preferred-language"></select>
        </div>
      </div>
    </header>

    <nav class="role-tabs" aria-label="Switch demo role">
      <a href="./coach.html" class="tab active" data-role-link="coach">Coach</a>
      <a href="./volunteer.html" class="tab" data-role-link="volunteer">Volunteer</a>
      <a href="./sponsor.html" class="tab" data-role-link="sponsor">Program Sponsor</a>
    </nav>

    <main class="main-content">
      <!-- Coach Panel -->
      <section class="role-panel active" data-role-panel="coach">
        <div class="panel-header">
          <h2>Upload Papers &amp; Manage Grading</h2>
          <label class="session-select">
            Signed in as
            <select id="active-coach"></select>
          </label>
        </div>

        <div class="sponsor-nav">
          <button type="button" class="sponsor-nav-btn active" data-coach-section="upload">Upload</button>
          <button type="button" class="sponsor-nav-btn" data-coach-section="pending">Pending Grading</button>
          <button type="button" class="sponsor-nav-btn" data-coach-section="waiting">Pending Student</button>
        </div>

        <div class="coach-sections">
          <section class="card coach-section" id="coach-section-upload">
            <h3>Upload Assignment</h3>
            <form id="upload-form" class="form">
              <label>
                Student
                <select id="upload-student" required></select>
              </label>
              <label>
                Class
                <select id="upload-class" required></select>
              </label>
              <label>
                Assignment
                <select id="upload-assignment" required></select>
              </label>
              <label>
                Paper language
                <select id="upload-language"></select>
              </label>
              <label>
                Grader
                <select id="upload-volunteer" required></select>
              </label>
              <label>
                Upload PDF or photo
                <input id="upload-file" type="file" accept="application/pdf,image/*" capture="environment" required>
              </label>
              <button type="submit" class="primary">Upload Paper</button>
            </form>
          </section>

          <section class="card coach-section hidden" id="coach-section-pending">
            <h3>Student Progress</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>Current class / assignment</th>
                    <th>Last completed</th>
                    <th>Pending status</th>
                    <th>Days with volunteer</th>
                  </tr>
                </thead>
                <tbody id="coach-report"></tbody>
              </table>
            </div>
          </section>

          <section class="card coach-section hidden" id="coach-section-waiting">
            <h3>Pending Student</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>Current Assignment</th>
                    <th>Days Since Last Submission</th>
                  </tr>
                </thead>
                <tbody id="coach-waiting-report"></tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
