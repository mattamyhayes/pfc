<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PFC - Admin</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- App Shell -->
  <div id="app-shell" class="shell">
    <header class="hero">
      <div class="brand-block">
        <img
          class="brand-logo"
          src="https://github.com/user-attachments/assets/0ed14a35-9025-4bc7-b757-60d0b6239a60"
          alt="PFC Prisoners For Christ"
        >
        <h1>Bible Institute Grading System</h1>
      </div>
      <div class="hero-actions">
        <div class="preferences">
          <label for="preferred-language">Language</label>
          <select id="preferred-language"></select>
        </div>
      </div>
    </header>

    <nav class="role-tabs" aria-label="Switch demo role">
      <a href="./coach.html" class="tab" data-role-link="coach">Coach</a>
      <a href="./volunteer.html" class="tab" data-role-link="volunteer">Volunteer</a>
      <a href="./sponsor.html" class="tab" data-role-link="sponsor">Program Sponsor</a>
      <a href="./admin.html" class="tab active" data-role-link="admin">Admin</a>
    </nav>

    <main class="main-content">
      <!-- Admin Panel -->
      <section class="role-panel active" data-role-panel="admin">
        <div class="panel-header">
          <h2>Class &amp; Assignment Setup</h2>
        </div>

        <div class="content-grid">
          <section class="card">
            <h3>Add a Class</h3>
            <form id="add-class-form" class="form form-inline">
              <label class="grow">
                Class name
                <input id="new-class-name" type="text" placeholder="Enter class name">
              </label>
              <button type="submit" class="secondary align-end">Add Class</button>
            </form>
          </section>

          <section class="card">
            <h3>Add Assignment</h3>
            <form id="class-form" class="form">
              <label>
                Class
                <select id="class-select" required></select>
              </label>
              <label>
                Assignment name
                <input id="assignment-name" type="text" required>
              </label>
              <label>
                Number of questions
                <input id="assignment-count" type="number" min="1" value="1" required>
              </label>
              <button type="submit" class="primary">Add Assignment</button>
            </form>
          </section>

          <section class="card">
            <h3>Class Catalog</h3>
            <div id="class-catalog" class="card-list"></div>
          </section>
        </div>
      </section>

      <!-- Summary & Activity (collapsed at bottom) -->
      <details class="activity-drawer">
        <summary>Activity Log &amp; Stats</summary>
        <div class="drawer-content">
          <section class="card">
            <h3>Overview</h3>
            <div class="stats" id="summary-stats"></div>
          </section>
          <section class="card">
            <h3>Email Activity</h3>
            <ul class="activity-list" id="email-log"></ul>
          </section>
        </div>
      </details>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
